apiVersion: apps/v1
kind: Deployment
metadata:
  name: wind-turbine-ml-deployment
  labels:
    app: wind-turbine
    tier: ml-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wind-turbine
      tier: ml-service
  template:
    metadata:
      labels:
        app: wind-turbine
        tier: ml-service
    spec:
      containers:
        - name: ml-service
          image: wind-turbine-dashboard:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.services.ml_service:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: http
              containerPort: 8001
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: wind-turbine-ml-service
  labels:
    app: wind-turbine
    tier: ml-service
spec:
  type: ClusterIP
  selector:
    app: wind-turbine
    tier: ml-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001

