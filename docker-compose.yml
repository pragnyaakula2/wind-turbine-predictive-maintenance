version: "3.8"

services:
  wind-turbine-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: wind-turbine-dashboard:latest
    container_name: wind_turbine_monitoring_app
    ports:
      - "8501:8501"
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0

