version: "3.8"

networks:
  turbine-network:
    driver: bridge

services:
  # Microservice 1: Classical Machine Learning API (Isolation Forest / LOF)
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: wind-turbine-microservices:latest
    container_name: wind_turbine_ml_service
    command: ["uvicorn", "src.services.ml_service:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - turbine-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Microservice 2: Deep Learning API (PyTorch LSTM Autoencoder)
  dl-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: wind-turbine-microservices:latest
    container_name: wind_turbine_dl_service
    command: ["uvicorn", "src.services.dl_service:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - turbine-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Microservice 3: Quantum Machine Learning API (PennyLane 4-Qubit VQC)
  qml-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: wind-turbine-microservices:latest
    container_name: wind_turbine_qml_service
    command: ["uvicorn", "src.services.qml_service:app", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "8003:8003"
    restart: unless-stopped
    networks:
      - turbine-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Frontend: Interactive Multi-Model Streamlit Dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: wind-turbine-microservices:latest
    container_name: wind_turbine_frontend_app
    command: ["streamlit", "run", "src/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    restart: unless-stopped
    networks:
      - turbine-network
    environment:
      - ML_SERVICE_URL=http://ml-service:8001
      - DL_SERVICE_URL=http://dl-service:8002
      - QML_SERVICE_URL=http://qml-service:8003
    depends_on:
      - ml-service
      - dl-service
      - qml-service
